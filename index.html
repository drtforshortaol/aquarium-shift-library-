<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<link rel="manifest" href="manifest.webmanifest">
   <link rel="apple-touch-icon" href="./Organize Aquarium Books.png">
<title>Aquarium Library Explorer</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#17201d;--muted:#66706c;--line:#dfe4e1;--accent:#174d46}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:820px;margin:auto;padding:18px 16px 70px}.top{position:sticky;top:0;background:rgba(247,247,244,.96);padding:10px 0 12px;z-index:5}
h1{font-size:25px;margin:2px 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
input{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:white}
.chips{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:white;padding:8px 11px;border-radius:999px;font-size:14px}
.chip.on{background:var(--accent);color:white;border-color:var(--accent)}
.count{font-size:13px;color:var(--muted);margin:12px 2px 8px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;margin:8px 0;padding:13px}
.title{font-weight:700;font-size:17px}.desc{font-size:14px;color:#39433f;margin-top:5px;line-height:1.35}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{font-size:12px;background:#eef2f0;padding:4px 7px;border-radius:999px}
details{margin-top:8px} summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}.meta{font-size:13px;color:var(--muted);line-height:1.5;padding-top:7px}
.empty{text-align:center;color:var(--muted);padding:35px 10px}.wish{font-size:12px;font-weight:700;color:#765d14;margin-left:6px}
</style></head>
<body><main>
<div class="top"><h1>Aquarium Library Explorer</h1><div class="sub">Thursday 2nd Library · simple search + multiple tags</div>
<input id="q" type="search" placeholder="Search books, subjects, authors, owners…" autocomplete="off">
<div class="chips" id="chips"></div></div>
<div class="count" id="count"></div><div id="list"></div>
</main>
<script src="library-data.js"></script>
<script>
const preferred=["All","Marine Mammals","Fish & Sharks","Cephalopods","Tidepools & Rocky Shore","Kelp & Seaweed","Birds","Deep Sea & Open Ocean","Monterey Bay","Conservation & Human Impact","Evolution & Adaptations","Wishlist"];
let active="All"; const q=document.querySelector("#q"), chips=document.querySelector("#chips"), list=document.querySelector("#list"), count=document.querySelector("#count");
function makeChips(){chips.innerHTML=""; preferred.forEach(x=>{let b=document.createElement("button");b.className="chip"+(x===active?" on":"");b.textContent=x;b.onclick=()=>{active=x;makeChips();render()};chips.appendChild(b)})}
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function render(){
 const term=q.value.trim().toLowerCase();
 const rows=LIBRARY_DATA.filter(b=>{
   const cat=active==="All" ? !b.wishlist : (active==="Wishlist" ? b.wishlist : (!b.wishlist && b.tags.includes(active)));
   const hay=[b.title,b.author,b.owner,b.description,...b.tags].join(" ").toLowerCase();
   return cat && (!term || hay.includes(term));
 });
 count.textContent=`${rows.length} ${rows.length===1?"book":"books"} shown`;
 list.innerHTML=rows.map(b=>`<article class="card">
   <div class="title">${esc(b.title)}${b.wishlist?'<span class="wish">WISHLIST</span>':''}</div>
   <div class="desc">${esc(b.description)}</div>
   <div class="tags">${b.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
   <details><summary>More</summary><div class="meta"><b>Author/Publisher:</b> ${esc(b.author)||"—"}<br><b>Owner:</b> ${esc(b.owner)||"—"}<br><b>Borrowed:</b> ${esc(b.borrowed)||"Not marked"}</div></details>
 </article>`).join("") || '<div class="empty">No matching books.</div>';
}
q.addEventListener("input",render); makeChips(); render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script></body></html>
